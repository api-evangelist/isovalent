openapi: 3.2.0
info:
  title: Cilium Daemon API
  description: Cilium
  version: v1beta1
servers:
- url: /v1
tags:
- name: Daemon
paths:
  /cluster/nodes:
    get:
      summary: Get nodes information stored in the cilium-agent
      tags:
      - Daemon
      parameters:
      - name: client-id
        description: 'Client UUID should be used when the client wants to request

          a diff of nodes added and / or removed since the last time

          that client has made a request.

          '
        in: header
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterNodeStatus'
      operationId: getClusterNodes
      x-operation-id-source: derived
  /healthz:
    get:
      summary: Get health of Cilium daemon
      description: 'Returns health and status information of the Cilium daemon and related

        components such as the connected datastore, Kubernetes integration and

        Hubble.'
      tags:
      - Daemon
      parameters:
      - name: brief
        description: 'Brief will return a brief representation of the Cilium status.

          '
        in: header
        required: false
        schema:
          type: boolean
      - name: require-k8s-connectivity
        description: 'If set to true, failure of the agent to connect to the Kubernetes control plane will cause the agent''s health status to also fail.

          '
        in: header
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
      operationId: getHealthz
      x-operation-id-source: derived
  /config:
    get:
      summary: Get configuration of Cilium daemon
      description: Returns the configuration of the Cilium daemon.
      tags:
      - Daemon
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaemonConfiguration'
      operationId: getConfig
      x-operation-id-source: derived
    patch:
      summary: Modify daemon configuration
      description: 'Updates the daemon configuration by applying the provided

        ConfigurationMap and regenerates & recompiles all required datapath

        components.'
      tags:
      - Daemon
      responses:
        '200':
          description: Success
        '400':
          description: Bad configuration parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
        '500':
          description: Recompilation failed
          x-go-name: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaemonConfigurationSpec'
        required: true
      operationId: patchConfig
      x-operation-id-source: derived
  /debuginfo:
    get:
      summary: Retrieve information about the agent and environment for debugging
      tags:
      - Daemon
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugInfo'
        '500':
          description: DebugInfo get failed
          x-go-name: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getDebuginfo
      x-operation-id-source: derived
  /cgroup-dump-metadata:
    get:
      summary: Retrieve cgroup metadata for all pods
      tags:
      - Daemon
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CgroupDumpMetadata'
        '500':
          description: CgroupDumpMetadata get failed
          x-go-name: Failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getCgroupDumpMetadata
      x-operation-id-source: derived
  /map:
    get:
      summary: List all open maps
      tags:
      - Daemon
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BPFMapList'
      operationId: getMap
      x-operation-id-source: derived
  /map/{name}:
    get:
      summary: Retrieve contents of BPF map
      tags:
      - Daemon
      parameters:
      - $ref: '#/components/parameters/map-name'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BPFMap'
        '404':
          description: Map not found
      operationId: getMapByName
      x-operation-id-source: derived
  /map/{name}/events:
    get:
      summary: Retrieves the recent event logs associated with this endpoint
      tags:
      - Daemon
      parameters:
      - $ref: '#/components/parameters/map-name'
      - $ref: '#/components/parameters/follow'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                format: binary
        '404':
          description: Map not found
      operationId: getMapByNameEvents
      x-operation-id-source: derived
  /node/ids:
    get:
      summary: List information about known node IDs
      description: 'Retrieves a list of node IDs allocated by the agent and their

        associated node IP addresses.'
      tags:
      - Daemon
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeID'
      operationId: getNodeIds
      x-operation-id-source: derived
components:
  schemas:
    EndpointStatusChange:
      description: 'Indication of a change of status


        +deepequal-gen=true'
      type: object
      properties:
        timestamp:
          description: Timestamp when status change occurred
          type: string
        code:
          description: Code indicate type of status change
          type: string
          enum:
          - ok
          - failed
        message:
          description: Status message
          type: string
        state:
          $ref: '#/components/schemas/EndpointState'
    BPFMapEntry:
      description: BPF map cache entry
      type: object
      properties:
        key:
          description: Key of map entry
          type: string
        value:
          description: Value of map entry
          type: string
        desired-action:
          description: Desired action to be performed
          type: string
          enum:
          - ok
          - insert
          - delete
        last-error:
          description: Last error seen while performing desired action
          type: string
    ServiceStatus:
      description: Configuration of a service
      type: object
      properties:
        realized:
          $ref: '#/components/schemas/ServiceSpec'
    ClusterMeshStatus:
      description: 'Status of ClusterMesh


        +k8s:deepcopy-gen=true'
      properties:
        clusters:
          description: List of remote clusters
          type: array
          items:
            $ref: '#/components/schemas/RemoteCluster'
    AllocationMap:
      description: 'Map of allocated IPs

        '
      type: object
      additionalProperties:
        type: string
    HubbleStatus:
      description: 'Status of the Hubble server


        +k8s:deepcopy-gen=true'
      type: object
      properties:
        state:
          type: string
          description: State the component is in
          enum:
          - Ok
          - Warning
          - Failure
          - Disabled
        msg:
          type: string
          description: Human readable status/error/warning message
        observer:
          type: object
          description: 'Status of the Hubble observer


            +k8s:deepcopy-gen=true'
          properties:
            max-flows:
              type: integer
              description: Maximum number of flows this Hubble observer is able to store
            current-flows:
              type: integer
              description: Current number of flows this Hubble observer stores
            seen-flows:
              type: integer
              description: Total number of flows this Hubble observer has seen
            uptime:
              type: string
              format: duration
              description: Uptime of this Hubble observer instance
    IPV6BigTCP:
      description: Status of IPv6 BIG TCP
      type: object
      properties:
        enabled:
          description: Is IPv6 BIG TCP enabled
          type: boolean
        maxGRO:
          description: Maximum IPv6 GRO size
          type: integer
        maxGSO:
          description: Maximum IPv6 GSO size
          type: integer
    CgroupContainerMetadata:
      description: cgroup container metadata
      type: object
      properties:
        cgroup-id:
          type: integer
          format: uint64
        cgroup-path:
          type: string
    Masquerading:
      description: 'Status of masquerading


        +k8s:deepcopy-gen=true'
      type: object
      properties:
        enabled:
          type: boolean
        enabledProtocols:
          description: Is masquerading enabled
          type: object
          properties:
            ipv4:
              description: Is masquerading enabled for IPv4 traffic
              type: boolean
            ipv6:
              description: Is masquerading enabled for IPv6 traffic
              type: boolean
        mode:
          type: string
          enum:
          - BPF
          - iptables
        ip-masq-agent:
          description: Is BPF ip-masq-agent enabled
          type: boolean
        snat-exclusion-cidr:
          description: This field is obsolete, please use snat-exclusion-cidr-v4 or snat-exclusion-cidr-v6.
          type: string
        snat-exclusion-cidr-v4:
          description: 'SnatExclusionCIDRv4 exempts SNAT from being performed on any packet sent to

            an IPv4 address that belongs to this CIDR.'
          type: string
        snat-exclusion-cidr-v6:
          description: 'SnatExclusionCIDRv6 exempts SNAT from being performed on any packet sent to

            an IPv6 address that belongs to this CIDR.

            For IPv6 we only do masquerading in iptables mode.'
          type: string
    DebugInfo:
      description: groups some debugging related information on the agent
      type: object
      properties:
        cilium-version:
          type: string
        kernel-version:
          type: string
        cilium-status:
          $ref: '#/components/schemas/StatusResponse'
        endpoint-list:
          type: array
          items:
            $ref: '#/components/schemas/Endpoint'
        service-list:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        policy:
          $ref: '#/components/schemas/Policy'
        cilium-memory-map:
          type: string
        cilium-nodemonitor-memory-map:
          type: string
        environment-variables:
          type: array
          items:
            type: string
        subsystem:
          type: object
          additionalProperties:
            type: string
        encryption:
          type: object
          properties:
            wireguard:
              description: Status of the WireGuard agent
              $ref: '#/components/schemas/WireguardStatus'
    NodeElement:
      description: 'Known node in the cluster


        +k8s:deepcopy-gen=true'
      properties:
        name:
          type: string
          description: 'Name of the node including the cluster association. This is typically

            <clustername>/<hostname>.

            '
        primary-address:
          description: Primary address used for intra-cluster communication
          $ref: '#/components/schemas/NodeAddressing'
        secondary-addresses:
          description: Alternative addresses assigned to the node
          type: array
          items:
            $ref: '#/components/schemas/NodeAddressingElement'
        health-endpoint-address:
          description: Address used for probing cluster connectivity
          $ref: '#/components/schemas/NodeAddressing'
        ingress-address:
          description: Source address for Ingress listener
          $ref: '#/components/schemas/NodeAddressing'
        source:
          description: Source of the node configuration
          type: string
    ConfigurationMap:
      description: 'Map of configuration key/value pairs.

        '
      type: object
      additionalProperties:
        type: string
    NamedPorts:
      description: 'List of named Layer 4 port and protocol pairs which will be used in Network

        Policy specs.


        +deepequal-gen=true

        +k8s:deepcopy-gen=true'
      type: array
      items:
        $ref: '#/components/schemas/Port'
    Port:
      description: 'Layer 4 port / protocol pair


        +deepequal-gen=true'
      type: object
      properties:
        protocol:
          description: Layer 4 protocol
          type: string
          enum:
          - TCP
          - UDP
          - SCTP
          - ICMP
          - ICMPV6
          - ANY
        port:
          description: Layer 4 port number
          type: integer
          format: uint16
        name:
          description: Optional layer 4 port name
          type: string
    CNIChainingStatus:
      description: Status of CNI chaining
      properties:
        mode:
          type: string
          enum:
          - none
          - aws-cni
          - flannel
          - generic-veth
          - portmap
    BandwidthManager:
      description: 'Status of bandwidth manager


        +k8s:deepcopy-gen=true'
      type: object
      properties:
        enabled:
          description: Is bandwidth manager enabled
          type: boolean
        devices:
          type: array
          items:
            type: string
        congestionControl:
          type: string
          enum:
          - cubic
          - bbr
    EndpointIdentifiers:
      description: 'Unique identifiers for this endpoint from outside cilium


        +deepequal-gen=true'
      type: object
      properties:
        cni-attachment-id:
          description: ID assigned to this attachment by container runtime
          type: string
        container-id:
          description: ID assigned by container runtime (deprecated, may not be unique)
          type: string
        container-name:
          description: Name assigned to container (deprecated, may not be unique)
          type: string
        docker-endpoint-id:
          description: Docker endpoint ID
          type: string
        docker-network-id:
          description: Docker network ID
          type: string
        pod-name:
          description: K8s pod for this endpoint (deprecated, may not be unique)
          type: string
        k8s-pod-name:
          description: K8s pod name for this endpoint (deprecated, may not be unique)
          type: string
        k8s-namespace:
          description: K8s namespace for this endpoint (deprecated, may not be unique)
          type: string
    CgroupPodMetadata:
      description: cgroup pod metadata
      type: object
      properties:
        name:
          type: string
        namespace:
          type: string
        containers:
          type: array
          items:
            $ref: '#/components/schemas/CgroupContainerMetadata'
        ips:
          type: array
          items:
            type: string
    EndpointPolicy:
      description: Policy information of an endpoint
      type: object
      properties:
        policy-revision:
          description: The agent-local policy revision
          type: integer
        id:
          description: Own identity of endpoint
          type: integer
        policy-enabled:
          description: Whether policy enforcement is enabled (ingress, egress, both or none)
          $ref: '#/components/schemas/EndpointPolicyEnabled'
        build:
          description: Build number of calculated policy in use
          type: integer
        allowed-ingress-identities:
          description: 'List of identities allowed to communicate to this endpoint

            '
          type: array
          items:
            type: integer
        denied-ingress-identities:
          description: 'List of identities not allowed to communicate to this endpoint

            '
          type: array
          items:
            type: integer
        allowed-egress-identities:
          description: 'List of identities to which this endpoint is allowed to communicate

            '
          type: array
          items:
            type: integer
        denied-egress-identities:
          description: 'List of identities to which this endpoint is not allowed to communicate

            '
          type: array
          items:
            type: integer
        l4:
          $ref: '#/components/schemas/L4Policy'
        cidr-policy:
          $ref: '#/components/schemas/CIDRPolicy'
    K8sStatus:
      description: 'Status of Kubernetes integration


        +k8s:deepcopy-gen=true'
      type: object
      properties:
        state:
          type: string
          description: State the component is in
          enum:
          - Ok
          - Warning
          - Failure
          - Disabled
        k8s-api-versions:
          type: array
          items:
            type: string
        msg:
          type: string
          description: Human readable status/error/warning message
    WireguardStatus:
      description: 'Status of the WireGuard agent


        +k8s:deepcopy-gen=true'
      properties:
        node-encryption:
          description: Node Encryption status
          type: string
        node-encrypt-opt-out-labels:
          description: Label selector for nodes which will opt-out of node-to-node encryption
          type: string
        interfaces:
          description: WireGuard interfaces managed by this Cilium instance
          type: array
          items:
            $ref: '#/components/schemas/WireguardInterface'
    BackendAddress:
      description: Service backend address
      type: object
      required:
      - ip
      properties:
        ip:
          description: Layer 3 address
          type: string
        protocol:
          description: Layer 4 protocol (TCP, UDP, etc)
          type: string
        port:
          description: Layer 4 port number
          type: integer
          format: uint16
        nodeName:
          description: Optional name of the node on which this backend runs
          type: string
        state:
          description: State of the backend for load-balancing service traffic
          type: string
          enum:
          - active
          - terminating
          - terminating-not-serving
          - quarantined
          - maintenance
        preferred:
          description: 'Indicator if this backend is preferred in the context of clustermesh service affinity. The value is set based

            on related annotation of global service. Applicable for active state only.'
          type: boolean
        weight:
          description: Backend weight
          type:
          - integer
          - 'null'
          format: uint16
        zone:
          description: Optional name of the zone in which this backend runs
          type: string
    HubbleMetricsStatus:
      description: 'Status of the Hubble metrics server


        +k8s:deepcopy-gen=true'
      type: object
      properties:
        state:
          type: string
          description: State the component is in
          enum:
          - Ok
          - Warning
          - Failure
          - Disabled
        msg:
          type: string
          description: Human readable status/error/warning message
    EndpointState:
      description: State of endpoint
      type: string
      enum:
      - waiting-for-identity
      - not-ready
      - waiting-to-regenerate
      - regenerating
      - restoring
      - ready
      - disconnecting
      - disconnected
      - invalid
    MonitorStatus:
      description: Status of the node monitor
      properties:
        cpus:
          description: Number of CPUs to listen on for events.
          type: integer
        npages:
          description: Number of pages used for the perf ring buffer.
          type: integer
        pagesize:
          description: Pages size used for the perf ring buffer.
          type: integer
        lost:
          description: Number of samples lost by perf.
          type: integer
        unknown:
          description: Number of unknown samples.
          type: integer
    ClusterNodeStatus:
      description: Status of cluster
      properties:
        self:
          description: Name of local node (if available)
          type: string
        nodes-added:
          description: List of known nodes
          type: array
          items:
            $ref: '#/components/schemas/NodeElement'
        nodes-removed:
          description: List of known nodes
          type: array
          items:
            $ref: '#/components/schemas/NodeElement'
        client-id:
          description: ID that should be used by the client to receive a diff from the previous request
          type: integer
    ServiceSpec:
      description: Configuration of a service
      type: object
      required:
      - frontend-address
      properties:
        id:
          description: Unique identification
          type: integer
        frontend-address:
          description: Frontend address
          $ref: '#/components/schemas/FrontendAddress'
        backend-addresses:
          description: List of backend addresses
          type: array
          items:
            $ref: '#/components/schemas/BackendAddress'
        flags:
          description: Optional service configuration flags
          type: object
          properties:
            type:
              description: Service type
              type: string
              enum:
              - ClusterIP
              - NodePort
              - ExternalIPs
              - HostPort
              - LoadBalancer
              - LocalRedirect
            trafficPolicy:
              description: Service external traffic policy (deprecated in favor of extTrafficPolicy)
              type: string
              enum:
              - Cluster
              - Local
            extTrafficPolicy:
              description: Service external traffic policy
              type: string
              enum:
              - Cluster
              - Local
            intTrafficPolicy:
              description: Service internal traffic policy
              type: string
              enum:
              - Cluster
              - Local
            natPolicy:
              description: Service protocol NAT policy
              type: string
              enum:
              - None
              - Nat46
              - Nat64
            healthCheckNodePort:
              description: Service health check node port
              type: integer
              format: uint16
            name:
              description: Service name  (e.g. Kubernetes service name)
              type: string
            namespace:
              description: Service namespace  (e.g. Kubernetes namespace)
              type: string
            cluster:
              description: Service cluster
              type: string
        updateServices:
          description: 'Update all services selecting the backends with their given states

            (id and frontend are ignored)

            '
          type: boolean
    BPFMap:
      description: BPF map definition and content
      type: object
      properties:
        path:
          description: Path to BPF map
          type: string
        cache:
          description: Contents of cache
          type: array
          items:
            $ref: '#/components/schemas/BPFMapEntry'
    Srv6:
      description: Status of the SRv6
      type: object
      properties:
        enabled:
          type: boolean
        srv6EncapMode:
          type: string
          enum:
          - SRH
          - Reduced
    KVstoreConfiguration:
      description: Configuration used for the kvstore
      properties:
        type:
          description: Type of kvstore
          type: string
        options:
          description: Configuration options
          type: object
          additionalProperties:
            type: string
    RemoteCluster:
      description: 'Status of remote cluster


        +k8s:deepcopy-gen=true'
      properties:
        name:
          description: Name of the cluster
          type: string
        ready:
          description: Indicates readiness of the remote cluster
          type: boolean
        connected:
          description: Indicates whether the connection to the remote kvstore is established
          type: boolean
        synced:
          description: Synchronization status about each resource type
          $ref: '#/components/schemas/RemoteClusterSynced'
        config:
          description: Cluster configuration exposed by the remote cluster
          $ref: '#/components/schemas/RemoteClusterConfig'
        num-nodes:
          description: Number of nodes in the cluster
          type: integer
        num-shared-services:
          description: Number of services in the cluster
          type: integer
        num-endpoint-slices:
          description: Number of endpoint slices in the cluster
          type: integer
        num-service-exports:
          description: Number of MCS-API service exports in the cluster
          type: integer
        num-identities:
          description: Number of identities in the cluster
          type: integer
        num-endpoints:
          description: Number of endpoints in the cluster
          type: integer
        status:
          description: Status of the control plane
          type: string
        num-failures:
          description: Number of failures reaching the cluster
          type: integer
        last-failure:
          description: Time of last failure that occurred while attempting to reach the cluster
          type: string
          format: date-time
    NodeAddressing:
      description: 'Addressing information of a node for all address families


        +k8s:deepcopy-gen=true'
      type: object
      properties:
        ipv6:
          $ref: '#/components/schemas/NodeAddressingElement'
        ipv4:
          $ref: '#/components/schemas/NodeAddressingElement'
    PolicyRule:
      description: A policy rule including the rule labels it derives from
      properties:
        rule:
          description: The policy rule as json
          type: string
        derived-from-rules:
          description: The policy rule labels identifying the policy rules this rule derives from
          type: array
          items:
            type: array
            items:
              type: string
        rules-by-selector:
          description: The policy rule labels identifying the policy rules this rule derives from, mapped by selector
          type: object
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string
    LabelConfigurationSpec:
      description: User desired Label configuration of an endpoint
      type: object
      properties:
        user:
          description: Custom labels in addition to orchestration system labels.
          $ref: '#/components/schemas/Labels'
    Error:
      type: string
    DaemonConfigurationStatus:
      description: 'Response to a daemon configuration request. Contains the addressing

        information, k8s, node monitor and immutable and mutable configuration

        settings.

        '
      type: object
      properties:
        realized:
          description: Currently applied configuration
          $ref: '#/components/schemas/DaemonConfigurationSpec'
        immutable:
          description: Immutable configuration (read-only)
          $ref: '#/components/schemas/ConfigurationMap'
        addressing:
          $ref: '#/components/schemas/NodeAddressing'
        k8s-endpoint:
          type: string
        k8s-configuration:
          type: string
        nodeMonitor:
          description: Status of the node monitor
          $ref: '#/components/schemas/MonitorStatus'
        kvstoreConfiguration:
          $ref: '#/components/schemas/KVstoreConfiguration'
        deviceMTU:
          description: MTU on workload facing devices
          type: integer
        routeMTU:
          description: MTU for network facing routes
          type: integer
        enableRouteMTUForCNIChaining:
          description: Enable route MTU for pod netns when CNI chaining is used
          type: boolean
        packetizationLayerPMTUDMode:
          description: Specifies what mode PLPMTUD probing on the pod netns should be set to (if empty will do nothing).
          type: string
        datapathMode:
          $ref: '#/components/schemas/DatapathMode'
        configuredDatapathMode:
          $ref: '#/components/schemas/ConfiguredDatapathMode'
        ipam-mode:
          description: Configured IPAM mode
          type: string
        masquerade:
          type: boolean
        masqueradeProtocols:
          description: Status of masquerading feature
          type: object
          properties:
            ipv4:
              description: Status of masquerading for IPv4 traffic
              type: boolean
            ipv6:
              description: Status of masquerading for IPv6 traffic
              type: boolean
        installUplinkRoutesForDelegatedIPAM:
          description: 'Install ingress/egress routes through uplink on host for Pods when working with

            delegated IPAM plugin.

            '
          type: boolean
        daemonConfigurationMap:
