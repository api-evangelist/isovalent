aid: isovalent
name: Isovalent
description: Isovalent is the company founded in 2017 by the creators of Cilium, the eBPF-based networking, security,
  and observability platform for Kubernetes and cloud-native infrastructure. Isovalent builds and maintains the
  open source Cilium project (a CNCF graduated project), the Hubble observability layer, and the Tetragon runtime
  security engine, and offers commercial Isovalent Enterprise for Cilium and Isovalent Enterprise for Tetragon distributions
  with hardened builds, support, and advanced features. Cilium replaces kube-proxy and traditional CNI plugins with
  identity-aware, eBPF-powered dataplane networking, network policy, service mesh, multi-cluster mesh, and deep
  flow-level observability. The developer surface spans the JSON REST API served by the cilium-agent, the cilium-health
  connectivity API, the gRPC Hubble Observer/Relay flow APIs, first-party Go client packages, and the cilium and
  hubble command-line tools. Isovalent was acquired by Cisco in 2024 and its technology now underpins Cisco's cloud-native
  security portfolio.
