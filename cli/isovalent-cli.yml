  - config
  - map
  - fqdn
  - bgp
  - monitor
  - debuginfo
- name: cilium-cli
  description: >-
    Standalone CLI to install, manage, upgrade, and troubleshoot Cilium on a
    Kubernetes cluster, run connectivity tests, and manage ClusterMesh and Hubble.
  docs: https://docs.cilium.io/en/stable/gettingstarted/k8s-install-default/
  repo: https://github.com/cilium/cilium-cli
  install:
  - method: homebrew
    detail: brew install cilium-cli
